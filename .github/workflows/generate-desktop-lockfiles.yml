name: Generate pinned Windows app npm lockfiles
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-desktop-lockfiles.yml'
permissions:
  contents: write
jobs:
  lockfiles:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup matching CI Node version
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate Forge dependency lockfile
        working-directory: forge
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate original desktop dependency lockfile
        working-directory: desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify Forge lockfile using npm ci
        working-directory: forge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify original desktop lockfile using npm ci
        working-directory: desktop
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check and commit both lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- forge/package-lock.json desktop/package-lock.json
          git diff --cached --exit-code
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Lockfiles already committed."
            exit 0
          }
          git commit -m "build: lock Forge and desktop npm dependencies"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit lockfiles" }
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "Failed to push lockfiles" }
