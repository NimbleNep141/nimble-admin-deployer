name: Nearium testnet contracts and admin dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: near-deployer-artifacts
  cancel-in-progress: true
jobs:
  # Browser integration gate: catches bundling errors that Node unit tests
  # cannot, before a broken admin site is published.
  wallet-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install admin dependencies
        working-directory: admin
        run: npm install --no-audit --no-fund
      - name: Build admin dashboard
        working-directory: admin
        run: npm run build
      - name: Install Chromium for wallet browser smoke test
        working-directory: admin
        run: npx playwright install --with-deps chromium
      - name: Verify wallet connectors initialize in real Chromium
        working-directory: admin
        run: node tests/wallet-browser-smoke.mjs
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev
      - name: Install cargo-near
        run: cargo install --locked cargo-near --version 0.22.0
      - name: Run v0.1 factory Rust tests
        working-directory: contracts/factory
        run: cargo test
      - name: Run v0.1 curve-token Rust tests
        working-directory: contracts/curve-token
        run: cargo test
      - name: Build factory WASM
        working-directory: contracts/factory
        run: cargo near build non-reproducible-wasm --no-abi
      - name: Build curve-token WASM
        working-directory: contracts/curve-token
        run: cargo near build non-reproducible-wasm --no-abi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run JS unit tests
        run: node --test admin/tests/*.test.mjs
      - name: Create hash manifest from built WASM
        run: python3 scripts/publish_manifest.py
      - name: Install admin frontend packages
        working-directory: admin
        run: npm install --no-audit --no-fund
      - name: Compile frontend
        working-directory: admin
        run: npm run build
      # Keep the browser dashboard downloadable without requiring GitHub Pages.
      # This repository is private and Pages may not be enabled.
      - name: Upload verified Testnet admin dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nearium-Testnet-Admin-Dashboard
          path: admin/dist
          retention-days: 30
          if-no-files-found: error
