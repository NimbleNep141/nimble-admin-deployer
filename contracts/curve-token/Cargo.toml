[package]
name = "near-curve-token"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = { version = "1", features = ["derive"] }
near-sdk = { version = "=5.29.1", features = ["legacy"] }
near-contract-standards = "=5.29.1"
primitive-types = { version = "0.13", default-features = false }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["legacy", "unit-testing"] }
